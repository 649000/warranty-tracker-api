name: "CodeQL SAST"

# Static Application Security Testing (SAST)
# Analyzes source code AST and dataflow to detect OWASP vulnerabilities (SQLi, path traversal, tainted input, etc.)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '15 10 * * 2' # Weekly scan on Tuesdays at 10:15 UTC

jobs:
  analyze:
    name: "CodeQL Analysis (Java)"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # Required to push SARIF results to GitHub Security tab

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Initializes CodeQL tools and registers query suites
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      # Explicit build for multi-module Maven project to trace Java compilation accurately
      - name: Build Java Modules
        run: mvn clean compile -DskipTests --batch-mode

      # Performs deep semantic taint tracking and vulnerability analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
