name: "CI - Build & Security Validation"

# Triggers: Run on pushes to main and every pull request targeting main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel in-progress runs for the same branch/PR when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. SECRET SCANNING: Shift-left security gate to detect committed secrets
  # ============================================================================
  secrets-scan:
    name: "Secret Scanning (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history required for git commit log scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # 2. CONTINUOUS INTEGRATION: Compile Java 21 and run unit test suite
  # ============================================================================
  build-and-test:
    name: "Java 21 Build & Unit Tests"
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven' # Automatically caches ~/.m2 dependencies based on pom.xml

      - name: Run Unit Tests (API Module)
        run: mvn test -pl api --batch-mode

      - name: Upload Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: api/target/surefire-reports/
          retention-days: 7

  # ============================================================================
  # 3. INFRASTRUCTURE AS CODE (IaC): Validate CDK synthesis for Dev & Prod
  # ============================================================================
  cdk-validation:
    name: "Validate Infrastructure (CDK Synth)"
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Package API for CDK Lambda Asset Staging
        run: mvn package -DskipTests -pl api --batch-mode

      - name: Run CDK Unit Tests
        env:
          SUPABASE_DB_URL: "jdbc:postgresql://localhost:5432/test"
          SUPABASE_DB_USER: "postgres"
          SUPABASE_DB_PASSWORD: "password"
        run: mvn test -pl cdk --batch-mode

      - name: Synthesize CloudFormation Templates (Dev & Prod)
        env:
          SUPABASE_DB_URL: "jdbc:postgresql://localhost:5432/test"
          SUPABASE_DB_USER: "postgres"
          SUPABASE_DB_PASSWORD: "password"
          SUPABASE_PROD_DB_URL: "jdbc:postgresql://localhost:5432/prod"
          SUPABASE_PROD_DB_USER: "postgres"
          SUPABASE_PROD_DB_PASSWORD: "password"
        run: |
          cd cdk
          cdk synth --all
          cdk synth -c env=prd --all

  # ============================================================================
  # 4. SOFTWARE COMPOSITION ANALYSIS (SCA): Block PRs with high/critical CVEs
  # ============================================================================
  dependency-review:
    name: "SCA Dependency Review"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Dependency Review Action
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
