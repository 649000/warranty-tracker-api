name: "CD - Deploy to AWS"

# Continuous Delivery / Deployment (CD)
# Provisions AWS Lambda & API Gateway using AWS CDK and OpenID Connect (OIDC).
# - Dev Environment: Fast JVM Lambda deployment.
# - Production Environment: High-performance GraalVM Native ARM64 deployment with approval gate.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - production
          - both

permissions:
  id-token: write   # Required for requesting the JWT from GitHub OIDC provider
  contents: read

jobs:
  # ============================================================================
  # 1. DEPLOY TO DEV ENVIRONMENT (JVM Lambda)
  # ============================================================================
  deploy-dev:
    name: "Deploy to Dev (JVM Lambda)"
    runs-on: ubuntu-latest
    if: "${{ github.event_name == 'push' || github.event.inputs.target_env == 'dev' || github.event.inputs.target_env == 'both' }}"
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Package API (JVM Lambda)
        run: mvn clean package -pl api --batch-mode

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Deploy CDK Dev Stack
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          cd cdk
          cdk deploy --all --require-approval never

  # ============================================================================
  # 2. DEPLOY TO PRODUCTION ENVIRONMENT (GraalVM Native ARM64)
  # ============================================================================
  deploy-production:
    name: "Deploy to Production (Native ARM64)"
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: "${{ always() && (github.event_name == 'push' || github.event.inputs.target_env == 'production' || github.event.inputs.target_env == 'both') && (needs.deploy-dev.result == 'success' || needs.deploy-dev.result == 'skipped') }}"
    environment: production # Configure environment protection rules in GitHub repo settings
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Compile GraalVM Native Image (Containerized ARM64)
        run: |
          mvn clean package -Pnative -Dquarkus.native.container-build=true -pl api --batch-mode

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Deploy CDK Production Stack
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
          SUPABASE_PROD_DB_USER: ${{ secrets.SUPABASE_PROD_DB_USER }}
          SUPABASE_PROD_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
        run: |
          cd cdk
          cdk deploy -c env=prd --all --require-approval never
