name: "DAST - OWASP ZAP Dynamic API Scan"

# Dynamic Application Security Testing (DAST)
# Interacts with live HTTP endpoints to discover security header flaws, CORS leaks,
# unhandled 500 error leaks, and input injection vulnerabilities via OpenAPI schema.

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target API Gateway base URL (e.g. https://xxx.execute-api.ap-southeast-1.amazonaws.com/api). Leave blank for ephemeral local scan.'
        required: false
        default: ''
  schedule:
    - cron: '0 4 * * 0' # Every Sunday at 04:00 UTC

jobs:
  dast-api-scan:
    name: "OWASP ZAP API Security Scan"
    runs-on: ubuntu-latest

    # Service container used when running ephemeral local tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: warranty_tracker_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # If no remote URL is passed, start Quarkus locally against the PostgreSQL service container
      - name: Start Ephemeral Quarkus Server
        if: "${{ github.event.inputs.target_url == '' }}"
        env:
          SUPABASE_DB_URL: jdbc:postgresql://localhost:5432/warranty_tracker_test
          SUPABASE_DB_USER: postgres
          SUPABASE_DB_PASSWORD: postgrespassword
        run: |
          echo "Starting Quarkus in dev mode with OpenAPI enabled..."
          mvn compile quarkus:dev -pl api -Dquarkus.http.port=8080 -Dquarkus.hibernate-orm.schema-management.strategy=drop-and-create &
          
          echo "Waiting for Quarkus healthcheck at http://localhost:8080/api/q/health..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8080/api/q/health > /dev/null; then
              echo "Quarkus is healthy and ready!"
              break
            fi
            echo "Waiting for API server... ($i/30)"
            sleep 2
          done

      # Calculate the target OpenAPI endpoint:
      # If custom URL provided, scan <target_url>/q/openapi.
      # If local, scan http://localhost:8080/api/q/openapi.
      - name: Determine OpenAPI Target
        id: target
        run: |
          if [ -n "${{ github.event.inputs.target_url }}" ]; then
            echo "scan_target=${{ github.event.inputs.target_url }}/q/openapi" >> $GITHUB_OUTPUT
          else
            echo "scan_target=http://localhost:8080/api/q/openapi" >> $GITHUB_OUTPUT
          fi

      # OWASP ZAP API Scan reads OpenAPI specifications and tests all endpoints
      - name: Run OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: ${{ steps.target.outputs.scan_target }}
          format: openapi
          cmd_options: '-a'
          allow_issue_writing: false

      # Archive HTML and JSON vulnerability audit reports
      - name: Upload DAST Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-dast-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 14
